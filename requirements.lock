# Fully-pinned dependency set. GENERATED, not hand-edited.
#
# WHY THIS FILE EXISTS
# --------------------
# The image used to build with `pip install .`, which re-resolves every
# dependency on every build. That means a rebuild whose actual change was
# unrelated could silently pull a new major version of anything. It did:
# mcp 2.0.0 removed `mcp.server.fastmcp`, which server.py imports, and the
# container crashlooped on 2026-08-11. innerspace hit the identical break on
# 2026-07-28 and fixed it the same way, with a lock.
#
# Capping mcp in pyproject.toml fixed that one package. This fixes the class:
# nothing here moves unless somebody regenerates the file on purpose.
#
# These versions are not a fresh resolve — they are `pip freeze` taken from the
# running production container on 2026-08-12, so they are known to work rather
# than merely known to be compatible. Note caldav==3.2.1 against a >=1.3.9
# floor: it had already crossed two major versions unnoticed.
#
# TO UPGRADE, deliberately:
#   pip install -r requirements.lock && pip install <pkg>==<new> && pip freeze
# then redeploy and check the healthcheck plus an actual calendar/mail call.
#
