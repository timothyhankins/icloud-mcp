[project]
name = "icloud-mcp"
version = "0.1.0"
description = "MCP server for iCloud integration (CalDAV, CardDAV, IMAP/SMTP)"
requires-python = ">=3.10"
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 removed mcp.server.fastmcp, which
    # server.py imports. Without this cap the next rebuild silently jumps major
    # version and the container crashloops on startup — which is exactly what
    # happened on 2026-08-11, on a deploy whose actual change was unrelated.
    # Moving to the 2.0 API is a real migration, not a version bump.
    "mcp[cli]>=1.26.0,<2",
    # Every one of these carries an upper bound for the same reason mcp does.
    # requirements.lock is the real defence — the container installs from it —
    # but these ranges still govern a local `pip install -e .`, which is where
    # a breaking version would otherwise be met first and blamed on something
    # else. caldav is the one to watch: the old >=1.3.9 floor let it reach
    # 3.2.1 across two major versions without anybody choosing that.
    "caldav>=3.2.1,<4",
    "vobject>=0.9.9,<1",
    "imapclient>=3.1.0,<4",
    "python-dotenv>=1.2.2,<2",
    "requests>=2.34.2,<3",
]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
